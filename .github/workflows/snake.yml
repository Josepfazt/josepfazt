name: Generate contribution snake

on:
  # Se ejecuta automáticamente todos los días.
  schedule:
    - cron: "0 0 * * *"

  # Permite ejecutarlo manualmente desde GitHub Actions.
  workflow_dispatch:

  # También se ejecuta cuando modificas la rama principal.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Josepfazt
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
